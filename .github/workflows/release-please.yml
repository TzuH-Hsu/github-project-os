name: release-please

# Maintains a running release PR on main (version bump + CHANGELOG.md, from
# Conventional Commits) via release-please's "simple" release-type, which
# maintains a version.txt at repo root in addition to CHANGELOG.md — that's
# expected/acceptable for this release-type, not a leftover artifact.
#
# HUMAN GATE — see ADR-0002 (docs/adr/ADR-0002-release-flow.md):
# release-please and CI both trigger on push:main, so an unverified commit
# could otherwise reach the release PR. The branch ruleset requires the `ci`
# status check before merge, so the release PR can't merge red — but that
# protection only holds if a human reviews and merges it manually.
# NEVER enable auto-merge on the release PR this action opens.

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write # release-please labels its release PRs
    steps:
      - name: Run release-please
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
