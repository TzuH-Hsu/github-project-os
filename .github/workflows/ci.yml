name: CI

# The `ci` job below is this repository's ONLY required status check
# (.github/rulesets/main-branch.json -> required_status_checks context "ci").
# Renaming the job key breaks every merge until the ruleset is updated to match.
#
# NEVER add a workflow-level `paths:`, `paths-ignore:`, or `branches:` filter to
# `on.pull_request`. A filtered-out workflow does not run at all, so the `ci`
# check is never created, and the PR parks forever on "Expected - waiting for
# status to be reported" with no failing job to point at. The repo becomes
# unmergeable and the cause is not visible in the Actions tab.
#
# Job-level `if:` is the opposite trap: a skipped job reports SUCCESS and
# satisfies the required check, letting unverified code merge past the gate.
# Neither mechanism belongs on this job.
#
# There is no minutes argument for either. The job runs in ~15s and bills as one
# rounded-up minute whether it does work or not, and this is a public repo where
# hosted runners are free. Skipping saves nothing and risks everything.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: `make lint-secrets` runs `gitleaks detect`, which
          # scans every commit, not just the tip. Do not shallow this.
          fetch-depth: 0
          # This job only reads. Keeping the token out of .git/config denies it
          # to every later step (and to any tool binary they install).
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*

      - name: Install markdownlint-cli2
        run: npm install -g markdownlint-cli2@0.23.0

      - name: Install yamllint
        run: |
          set -euo pipefail
          if command -v pipx >/dev/null 2>&1; then
            pipx install yamllint==1.38.0
          else
            python3 -m pip install --user yamllint==1.38.0
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Version pins and checksum verification live in
      # scripts/install-ci-tools.sh, shared with maintenance.yml. This step was
      # previously ~40 lines of shell duplicated verbatim in both workflows.
      - name: Install release binaries
        run: make ci-tools TOOLS="actionlint gitleaks lychee"

      - name: Run CI
        run: make ci-pr
