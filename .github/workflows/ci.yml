name: CI

# The `ci` job below is this repository's ONLY required status check
# (.github/rulesets/main-branch.json -> required_status_checks context "ci").
# Renaming the job key breaks every merge until the ruleset is updated to match.
#
# NEVER add a workflow-level `paths:`, `paths-ignore:`, or `branches:` filter to
# `on.pull_request`, and never make its `types:` anything less than a superset
# of the defaults. A filtered-out workflow does not run at all, so the `ci`
# check is never created, and the PR parks forever on "Expected - waiting for
# status to be reported" with no failing job to point at. The repo becomes
# unmergeable and the cause is not visible in the Actions tab.
#
# Job-level `if:` is the opposite trap: a skipped job reports SUCCESS and
# satisfies the required check, letting unverified code merge past the gate.
# Neither mechanism belongs on this job.
#
# There is no minutes argument for either. The job runs in ~15s and bills as one
# rounded-up minute whether it does work or not, and this is a public repo where
# hosted runners are free. Skipping saves nothing and risks everything.
#
# `runs-on` below is a THIRD route into the same "waiting for status" trap, and
# the only one an adopter can trigger from repository settings rather than from
# this file. Measured, not assumed: with the variable set to the tempting wrong
# value `ubuntu-latest` (a bare string instead of a JSON array), fromJSON fails,
# the run completes with conclusion=failure and the message "This run likely
# failed because of a workflow file issue", ZERO jobs are created, and ZERO
# check runs are attached to the commit. The `ci` check is therefore never
# reported and the PR cannot merge. Recovery, which is not obvious from the
# symptom:
#
#   gh variable delete RUNNER_LABELS
#
# Self-hosted runners are NOT safe here while this repository is public: this
# workflow runs on pull_request, which includes fork PRs, and it checks out and
# executes the PR's own Makefile and scripts. See docs/setup/runners.md.
#
# See docs/setup/runners.md before setting it.
#
# The `Lint the pull request` step (pull_request events only, step-level `if`
# so the job still reports) fails this required check when the head branch is
# not `<type>/<issue#>-<slug>` or the body links no issue — the logic is
# scripts/pr-lint.js (ADR-0008), tested by `make check`. Bot PRs are exempt
# by author (dependabot[bot], github-actions[bot]) or by release-please's
# `autorelease: pending` label — never by branch name, which a fork author
# chooses. Because this job already executes
# the PR's own Makefile and scripts, it also runs the PR's own copy of
# pr-lint.js; a PR can therefore weaken its own lint, and the reviewer sees
# that in the diff. One difference from the `run:` steps: github-script is a
# JS action, so the PR's script runs with the job's GITHUB_TOKEN (read-only on
# fork PRs; `contents`, `issues` and `pull-requests` read here) and the
# run-scoped runtime token in its environment — nothing this public
# repository does not already expose, but not zero either, which is why the
# step stays tiny. The script uses the client for exactly one read:
# confirming the linked issue exists, is open, and is an issue, not a pull
# request. The `permissions:` block below says why that read needs two
# scopes beyond `contents`; take the block with the step when upgrading.

on:
  pull_request:
    # A SUPERSET of the defaults (opened, synchronize, reopened). `edited` and
    # `ready_for_review` are added so a PR that failed the lint on its body or
    # title turns green when the author fixes it, without a push — "Re-run
    # jobs" replays the ORIGINAL payload and would judge the old body.
    # `labeled` is added because release-please applies `autorelease: pending`
    # AFTER opening the PR; with a PAT-authored release PR that label is what
    # exempts it. Never narrow this list: a `types:` without the three
    # defaults is the "check never created" trap described above.
    types: [opened, synchronize, reopened, edited, ready_for_review, labeled, unlabeled]
  push:
    branches:
      - main

permissions:
  contents: read
  # The two extra read scopes exist for the lint step's one API call. On a
  # public repository an issue is readable without them; on a PRIVATE one
  # `issues.get` returns 403 "Resource not accessible by integration" under
  # `contents: read` alone — measured, and it fails every PR. `issues: read`
  # covers an issue number; `pull-requests: read` is needed as well when the
  # number turns out to be a pull request, which the lint has to detect to
  # reject it. Both are read-only; fork PRs get a read-only token anyway.
  issues: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: `make lint-secrets` runs `gitleaks detect`, which
          # scans every commit, not just the tip. Do not shallow this.
          fetch-depth: 0
          # This job only reads. Keeping the token out of .git/config denies it
          # to every `run:` step (and to any tool binary they install); the one
          # `uses:` step below is the exception the header describes.
          persist-credentials: false

      - name: Lint the pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { run } = require(`${process.env.GITHUB_WORKSPACE}/scripts/pr-lint.js`);
            await run({ github, context, core });

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*

      # Every tool version pin, plus the checksum verification, lives in
      # scripts/install-ci-tools.sh (shared with maintenance.yml) so that
      # `make check-tool-versions` has a single place to diff against upstream.
      # This was three separate steps, one of them ~40 lines of shell duplicated
      # verbatim in maintenance.yml.
      - name: Install CI tools
        run: make ci-tools TOOLS="markdownlint-cli2 yamllint actionlint gitleaks lychee"

      - name: Run CI
        run: make ci-pr
