name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: lts/*

      - name: Install markdownlint-cli2
        run: npm install -g markdownlint-cli2

      - name: Install yamllint
        run: |
          set -euo pipefail
          if command -v pipx >/dev/null 2>&1; then
            pipx install yamllint
          else
            python3 -m pip install --user yamllint
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install release binaries
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          cd "$tmp"

          verify_checksum() {
            local asset="$1" checksums="$2" line hash
            line="$(grep -F "$asset" "$checksums" || true)"
            if [ -z "$line" ]; then
              line="$(head -n 1 "$checksums")"
            fi
            hash="$(printf '%s\n' "$line" | grep -Eo '[A-Fa-f0-9]{64}' | head -n 1)"
            test -n "$hash"
            printf '%s  %s\n' "$hash" "$asset" | sha256sum -c -
          }

          install_tar_binary() {
            local repo="$1" tag="$2" asset="$3" checksums="$4" binary="$5"
            local url="https://github.com/${repo}/releases/download/${tag}"
            curl -fsSLO "$url/$asset"
            curl -fsSLO "$url/$checksums"
            verify_checksum "$asset" "$checksums"
            tar -xzf "$asset" "$binary"
            sudo install -m 0755 "$binary" "/usr/local/bin/$binary"
          }

          install_tar_binary "rhysd/actionlint" "v1.7.12" "actionlint_1.7.12_linux_amd64.tar.gz" "actionlint_1.7.12_checksums.txt" "actionlint"
          install_tar_binary "gitleaks/gitleaks" "v8.30.1" "gitleaks_8.30.1_linux_x64.tar.gz" "gitleaks_8.30.1_checksums.txt" "gitleaks"
          install_tar_binary "lycheeverse/lychee" "lychee-v0.24.2" "lychee-x86_64-unknown-linux-gnu.tar.gz" "lychee-x86_64-unknown-linux-gnu.tar.gz.sha256" "lychee"

      - name: Run CI
        run: make ci-pr
