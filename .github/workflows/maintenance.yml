name: Maintenance

# Weekly docs-drift detector: runs the full external link check (unlike CI's
# --offline pass) so dead links surface here instead of silently rotting.
# Failures show up in the Actions tab and email the maintainer per GitHub's
# default scheduled-workflow-failure notifications.

on:
  schedule:
    - cron: "0 3 * * 1" # Monday 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  link-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job only reads (lychee walks ./**/*.md). Default shallow clone
          # is correct here — unlike ci.yml, nothing scans git history — and the
          # token stays out of .git/config.
          persist-credentials: false

      # Shares scripts/install-ci-tools.sh with ci.yml, so the lychee version
      # pin and checksum verification exist in exactly one place. This step was
      # previously ~40 lines of shell duplicated verbatim from ci.yml.
      - name: Install lychee
        run: make ci-tools TOOLS="lychee"

      - name: Check external links
        run: make lint-docs-external

      # Tool-version drift detector (issue #14). The five CI tool pins live in
      # scripts/install-ci-tools.sh and are invisible to Dependabot — there is
      # no manifest for it to read — so this step is the only thing watching
      # them. Weekly, and free: hosted runners cost nothing on a public repo,
      # and this is three GitHub API calls plus two registry fetches.
      #
      # `if: always()` so a failing link check cannot mask version drift; both
      # findings belong in the same failure email. This is step orchestration,
      # not business logic — the logic lives in the make target. Safe here
      # because `link-check` is NOT a required status check (only `ci` is), so
      # no merge gating depends on it.
      - name: Check CI tool versions
        if: always()
        env:
          # Lets the script use `gh` (1,000 req/hr per repo) rather than the
          # shared unauthenticated 60/hr-per-IP pool. Read-only public metadata;
          # the job keeps its top-level `contents: read` permission.
          GH_TOKEN: ${{ github.token }}
        run: make check-tool-versions
